# Skills Mirage cluster: 1 master + 2 workers (HDFS + YARN), Hive, and MongoDB.
# Start from the repo root:  scripts/cluster_up.sh   (uses --env-file .env)
# STATUS: written from docs/ARCHITECTURE.md and D-011/D-012; NOT yet run (D-010, D-030).
# Secrets come from .env (git-ignored); nothing secret is written here.
x-hadoop-node: &hadoop-node
  build:
    context: ../..
    dockerfile: config/cluster/hadoop.Dockerfile
  image: skills-mirage-hadoop:3.3.6
  volumes:
    - ../hadoop:/opt/hadoop/etc/hadoop:ro
    - ../..:/workspace
  restart: unless-stopped

services:
  hdp-master:
    <<: *hadoop-node
    container_name: hdp-master
    hostname: hdp-master
    command: ["master"]
    environment:
      # Inside the Docker network MongoDB is reachable as "mongo", not localhost.
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      PIPELINE_MODE: cluster
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "9870:9870"   # NameNode UI
      - "8088:8088"   # ResourceManager UI
    volumes:
      - ../hadoop:/opt/hadoop/etc/hadoop:ro
      - ../..:/workspace
      - hdp_master_name:/hadoop/dfs/name
    depends_on:
      - mongo

  hdp-worker1:
    <<: *hadoop-node
    container_name: hdp-worker1
    hostname: hdp-worker1
    command: ["worker"]
    ports:
      - "9865:9864"   # DataNode UI
      - "8042:8042"   # NodeManager UI
    volumes:
      - ../hadoop:/opt/hadoop/etc/hadoop:ro
      - hdp_worker1_data:/hadoop/dfs/data
    depends_on:
      - hdp-master

  hdp-worker2:
    <<: *hadoop-node
    container_name: hdp-worker2
    hostname: hdp-worker2
    command: ["worker"]
    ports:
      - "9866:9864"
      - "8043:8042"
    volumes:
      - ../hadoop:/opt/hadoop/etc/hadoop:ro
      - hdp_worker2_data:/hadoop/dfs/data
    depends_on:
      - hdp-master

  hive-postgres:
    image: postgres:15
    container_name: hive-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_DB_PASSWORD}
    volumes:
      - hive_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  hive-metastore:
    build:
      context: ../..
      dockerfile: config/cluster/hive.Dockerfile
    image: skills-mirage-hive:3.1.3
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_DB_PASSWORD: ${HIVE_DB_PASSWORD}
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HIVE_DB_PASSWORD}
    volumes:
      - ../hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    ports:
      - "9083:9083"
    depends_on:
      - hive-postgres
      - hdp-master
    restart: unless-stopped

  hive-server2:
    image: skills-mirage-hive:3.1.3
    container_name: hive-server2
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: "-Dhive.metastore.uris=thrift://hive-metastore:9083"
    volumes:
      - ../hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: skills-mirage-mongo
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  hdp_master_name:
  hdp_worker1_data:
  hdp_worker2_data:
  hive_pg_data:
