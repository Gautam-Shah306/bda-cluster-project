# Skills Mirage pipeline configuration
# mode is overridden by the PIPELINE_MODE environment variable if set.
mode: local

local:
  root: dataset

cluster:
  root: hdfs://hdp-master:9000/skills_mirage
  spark_master: yarn

spark:
  driver_memory: 2g
  executor_memory: 2g
  sql_shuffle_partitions: 8

paths:
  raw_jobs: raw/jobs
  raw_courses: raw/courses
  raw_scraped_jobs: raw/scraped_jobs
  raw_scraped_courses: raw/scraped_courses
  processed_jobs: processed/jobs
  processed_courses: processed/courses
  analytics: analytics
  smoke_test: analytics/smoke_test

hive:
  database: skills_mirage
