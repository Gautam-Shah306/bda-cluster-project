# Spark settings for CLUSTER mode (D-011, D-012). Loaded through SPARK_CONF_DIR=/workspace/config/spark.
# Local mode ignores this file because src/common/spark_session.py sets its own master.
spark.master                          yarn
spark.submit.deployMode               client
spark.driver.memory                   1g
spark.executor.memory                 1g
spark.executor.instances              2
spark.yarn.am.memory                  512m
spark.sql.shuffle.partitions          2
spark.hadoop.fs.defaultFS             hdfs://hdp-master:9000
spark.sql.warehouse.dir               hdfs://hdp-master:9000/user/hive/warehouse

# Hive 3.1.3 metastore (D-012). The jars come from the hadoop image (HIVE_JARS_DIR).
spark.hadoop.hive.metastore.uris      thrift://hive-metastore:9083
spark.sql.hive.metastore.version      3.1
spark.sql.hive.metastore.jars         path
spark.sql.hive.metastore.jars.path    file:///opt/hive-jars/*.jar

# Optional speed-up: upload the Spark jars to HDFS once, then uncomment, so every job
# does not re-upload them:  hdfs dfs -put <pyspark>/jars /spark/jars
# spark.yarn.jars                     hdfs://hdp-master:9000/spark/jars/*.jar
